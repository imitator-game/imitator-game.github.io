<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena — The Imitator Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="assets/media/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script>
    (function () {
      const t = localStorage.getItem("pst-theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body class="arena-page">
<div class="pst-page">

  <header class="pst-header">
    <div class="pst-content-wrapper pst-header-inner">
      <a href="index.html" class="pst-header-brand">
        <span class="brand-logo" aria-hidden="true">
          <img src="assets/media/logo.png" alt="The Imitator Game logo">
        </span>
        The&thinsp;Imitator&thinsp;Game
      </a>
      <nav class="pst-header-nav">
        <a href="index.html"><i class="fas fa-home"></i>Home</a>
        <a href="arena.html" class="active"><i class="fas fa-pen-to-square"></i>Arena</a>
        <a href="gallery.html"><i class="fas fa-film"></i>Gallery</a>
      </nav>
      <div class="pst-header-end">
        <button class="theme-toggle" id="theme-toggle-btn" title="Toggle dark mode">☾ Dark</button>
      </div>
    </div>
  </header>

  <main class="pst-main">
    <div class="pst-content-wrapper">

      <div class="arena-header">
        <div>
          <h1 class="arena-title">Imitator Arena</h1>
          <p class="arena-subtitle">
            Watch the human reference and compare two anonymous model rollouts.
          </p>
        </div>
        <div id="arena-bucket-badge" class="arena-bucket-badge"></div>
      </div>

      <!-- Re-rendered for each comparison -->
      <div id="arena-card"></div>

      <!-- Ephemeral confirmation toast -->
      <div id="arena-toast" class="arena-toast" style="display:none;"></div>

    </div>
  </main>

</div>
<script src="assets/js/manifest-data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/arena.js"></script>
</body>
</html>
