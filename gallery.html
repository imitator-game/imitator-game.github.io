<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Gallery — The Imitator Game</title>
  <meta name="description" content="Every task group in IG-10K, with the human demonstration, the real-robot rollout and the simulation rollout side by side at each of the four imitation levels.">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="assets/media/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css?v=20260824-motion">
  <link rel="stylesheet" href="assets/css/motion.css?v=20260824-motion">
  <link rel="stylesheet" href="assets/css/pages.css?v=20260824-motion">
  <script>
    /* No-flash theme boot — mirrors theme.js, must stay in <head>. */
    (function () {
      var m = "system";
      try { var v = localStorage.getItem("ig-theme"); if (v === "light" || v === "dark" || v === "system") m = v; } catch (e) {}
      var t = m === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : m;
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-theme-mode", m);
    })();
  </script>
</head>
<body>
<div class="ig-scroll-progress"></div>
<div class="pst-page">

  <header class="pst-header">
    <div class="pst-content-wrapper pst-header-inner">
      <a href="index.html" class="pst-header-brand">
        <span class="brand-logo" aria-hidden="true">
          <img src="assets/media/logo.svg" alt="">
        </span>
        The&thinsp;Imitator&thinsp;Game
      </a>
      <nav class="pst-header-nav">
        <a href="index.html"><i class="fas fa-home"></i>Home</a>
        <a href="leaderboard.html"><i class="fas fa-ranking-star"></i>Leaderboard</a>
        <a href="docs/guide.html"><i class="fas fa-book"></i>Docs</a>
        <a href="community.html"><i class="fas fa-people-group"></i>Community</a>
        <a href="data.html"><i class="fas fa-database"></i>Data</a>
        <a href="arena.html"><i class="fas fa-pen-to-square"></i>Arena</a>
        <a href="gallery.html" class="active"><i class="fas fa-film"></i>Gallery</a>
        <a href="submit.html"><i class="fas fa-upload"></i>Submit</a>
      </nav>
      <div class="pst-header-end"><div id="theme-switch"></div></div>
    </div>
  </header>

  <main class="pst-main">
    <div class="pst-content-wrapper">

      <!-- Grid view -->
      <div id="gallery-view" class="page-container">
        <div class="page-header">
          <div>
            <div class="ig-eyebrow" data-reveal="up"><i class="fas fa-film"></i>Footage</div>
            <h1 class="page-title" data-split="45" data-reveal>Task Gallery</h1>
            <p class="page-subtitle" id="gallery-subtitle" data-reveal="up" data-reveal-delay="180">
              Browse task groups, each with four imitation difficulty levels.
            </p>
          </div>
        </div>

        <div class="gallery-showcase" id="gallery-showcase" data-reveal="up" data-reveal-delay="200"></div>

        <div class="gallery-toolbar" data-reveal="up" data-reveal-delay="240">
          <input type="text" id="gallery-search" class="form-input gallery-search"
                 placeholder="🔍  Filter tasks…">
          <div class="gallery-count" id="gallery-count"></div>
        </div>

        <div class="gallery-grid" id="gallery-grid"></div>
      </div>

      <!-- Task detail view (hidden until a card is clicked) -->
      <div id="task-view" style="display:none;"></div>

    </div>
  </main>

  <footer class="lp-footer"><div class="lp-footer-inner">
    <span>The Imitator Game</span>
    <span>The Imitator Game Team @ 2026</span>
  </div></footer>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/manifest-data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
